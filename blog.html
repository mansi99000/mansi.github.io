<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Blog – Mansi Maheshwari</title>
    <meta name="author" content="Mansi Maheshwari">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="images/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      body { font-family: 'EB Garamond', Georgia, serif; margin: 0; }

      /* Dark theme */
      body.dark-theme { background-color: #1a1a1a; color: #e0e0e0; }
      body.dark-theme h1, body.dark-theme h2 { color: #fff; }
      body.dark-theme a { color: inherit; }
      body.dark-theme .post-card:hover { background: #242424; }
      body.dark-theme .post-meta { color: #888; }
      body.dark-theme .post-tag { background: #2d2d2d; color: #aaa; }
      body.dark-theme .post-excerpt { color: #bbb; }
      body.dark-theme div[style*="position:sticky"] { background-color: #1a1a1a !important; }
      body.dark-theme a[style*="color:#333"] { color: #b0b0b0 !important; }
      body.dark-theme a[style*="color:#333"]:hover { color: #4a9eff !important; }

      #theme-toggle { background: none; border: none; cursor: pointer; font-family: inherit; font-size: 16px; padding: 0; }

      /* Index layout */
      .blog-wrap { max-width: 680px; margin: 0 auto; padding: 3rem 24px 5rem; }
      .blog-wrap h1 { font-size: 2rem; font-weight: 700; margin: 0 0 2.5rem; }

      /* Post card */
      .post-card {
        display: block;
        text-decoration: none;
        color: inherit;
        padding: 1.4rem 0;
        border-bottom: 1px solid #eee;
        transition: background 0.15s;
      }
      body.dark-theme .post-card { border-bottom-color: #2a2a2a; }
      .post-card:first-of-type { border-top: 1px solid #eee; }
      body.dark-theme .post-card:first-of-type { border-top-color: #2a2a2a; }

      .post-card-title {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.35rem;
        line-height: 1.3;
      }

      .post-meta {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 0.88rem;
        color: #888;
        margin-bottom: 0.6rem;
        flex-wrap: wrap;
      }

      .post-tag {
        display: inline-block;
        padding: 2px 10px;
        background: #f0f0f0;
        border-radius: 4px;
        font-size: 0.82rem;
        color: #666;
      }

      .post-excerpt {
        font-size: 1rem;
        line-height: 1.6;
        color: #555;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <!-- Navigation -->
    <div style="position:sticky;top:0;background-color:white;z-index:1000;width:100%;max-width:800px;margin:0 auto;padding:20px 0;text-align:center;border-bottom:none;" id="nav">
      <a href="index.html#about" style="margin:0 15px;text-decoration:none;color:#333;font-weight:500;font-size:16px;">About</a>
      <a href="index.html#news"  style="margin:0 15px;text-decoration:none;color:#333;font-weight:500;font-size:16px;">News</a>
      <a href="index.html#research" style="margin:0 15px;text-decoration:none;color:#333;font-weight:500;font-size:16px;">Research</a>
      <a href="index.html#teaching" style="margin:0 15px;text-decoration:none;color:#333;font-weight:500;font-size:16px;">Teaching</a>
      <a href="CV/Mansi_CV.pdf" style="margin:0 15px;text-decoration:none;color:#333;font-weight:500;font-size:16px;">CV</a>
      <a href="blog.html" style="margin:0 15px;text-decoration:none;color:#333;font-weight:500;font-size:16px;">Blog</a>
      <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" style="margin:0 15px;color:#333;font-size:16px;">🌙</button>
    </div>

    <!-- Blog index -->
    <div class="blog-wrap">
      <h1>Blog</h1>

      <!-- ── Post: Notes for your PhD Application ── -->
      <a class="post-card" href="posts/phd-application.html">
        <div class="post-card-title">Notes for your PhD Application</div>
        <div class="post-meta">
          <span class="post-tag">Reflection</span>
          <span><i class="far fa-clock"></i>&nbsp;4 min read</span>
          <span><i class="far fa-calendar"></i>&nbsp;Nov 2026</span>
        </div>
        <p class="post-excerpt">I hope this demystifies parts of the process and encourages you to apply. :))</p>
      </a>

      <!-- Add new posts above this line -->

    </div>

    <script>
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('nav').style.backgroundColor = '#1a1a1a';
        document.getElementById('theme-toggle').textContent = '☀️';
      }
      function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('theme-toggle');
        const nav = document.getElementById('nav');
        if (body.classList.contains('dark-theme')) {
          body.classList.remove('dark-theme');
          btn.textContent = '🌙';
          nav.style.backgroundColor = 'white';
          localStorage.setItem('theme', 'light');
        } else {
          body.classList.add('dark-theme');
          btn.textContent = '☀️';
          nav.style.backgroundColor = '#1a1a1a';
          localStorage.setItem('theme', 'dark');
        }
      }
    </script>
  </body>
</html>
